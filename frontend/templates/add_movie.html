{% extends "base.html" %}

{% block title %}Añadir película - CineFlask{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1><i class="fas fa-plus-circle me-2"></i>Añadir película</h1>
        <div class="card">
            <div class="card-body">
                <form method="POST" action="{{ url_for('new_movie') }}" novalidate>
                    <div class="mb-3">
                        <label for="title" class="form-label">Título *</label>
                        <input type="text" class="form-control" id="title" name="title"
                               value="{{ form.get('title', '') }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="director" class="form-label">Director *</label>
                        <input type="text" class="form-control" id="director" name="director"
                               value="{{ form.get('director', '') }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="year" class="form-label">Año *</label>
                            <input type="number" class="form-control" id="year" name="year"
                                   min="1888" max="2100" value="{{ form.get('year', '') }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="genre" class="form-label">Género *</label>
                            <input type="text" class="form-control" id="genre" name="genre"
                                   value="{{ form.get('genre', '') }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="rating" class="form-label">Puntuación (0-10)</label>
                            <input type="number" class="form-control" id="rating" name="rating"
                                   min="0" max="10" step="0.1" value="{{ form.get('rating', '') }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Sinopsis *</label>
                        <textarea class="form-control" id="description" name="description"
                                  rows="4" required>{{ form.get('description', '') }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="poster_url" class="form-label">URL del póster</label>
                        <input type="url" class="form-control" id="poster_url" name="poster_url"
                               value="{{ form.get('poster_url', '') }}">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Guardar película
                    </button>
                    <a href="{{ url_for('movies') }}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
